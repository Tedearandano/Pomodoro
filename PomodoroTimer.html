<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a2e;
      font-family: 'Syne', sans-serif;
      overflow: hidden;
      transition: background 0.5s;
    }
    body.light  { background: #d8d6d0; }
    body.short  { background: #1e2c2a; }
    body.light.short { background: #c8e8e2; }
    body.long   { background: #1e2435; }
    body.light.long  { background: #ccdcf4; }

    #bg-layer {
      position: fixed; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 0.6s; z-index: 0;
    }
    #bg-layer.on { opacity: 1; }
    #bg-overlay {
      position: fixed; inset: 0;
      background: transparent; transition: background 0.4s; z-index: 1;
    }
    body.has-bg #bg-overlay { background: rgba(0,0,0,0.50); }

    /* ── Glass card ── */
    .card {
      position: relative; z-index: 2;
      width: min(520px, 96vw);
      border-radius: 28px;
      padding: clamp(22px,2.2vw,38px) clamp(22px,2.2vw,38px) clamp(28px,2.8vw,44px);
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(13px,1.4vh,20px);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      transition: background 0.5s, border 0.5s;
    }
    body:not(.has-bg) .card { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    body.light:not(.has-bg) .card { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }

    /* ── Top bar ── */
    .topbar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .topbar-right { display: flex; gap: 8px; }

    .ib {
      width: clamp(32px,2.2vw,40px); height: clamp(32px,2.2vw,40px);
      border-radius: 9px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px); outline: none; transition: all 0.15s;
    }
    body.light:not(.has-bg) .ib { background: rgba(0,0,0,0.07); border-color: rgba(0,0,0,0.14); color: #555; }
    .ib:hover { opacity: 0.72; transform: scale(1.05); }
    .ib svg { width: clamp(15px,1.1vw,19px); height: clamp(15px,1.1vw,19px); stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* cycle dots */
    .cycle-dots { display: flex; gap: 7px; align-items: center; }
    .cdot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.20); transition: all 0.35s; }
    body.light:not(.has-bg) .cdot { background: rgba(0,0,0,0.15); }
    .cdot.done { background: rgba(255,255,255,0.60); }
    body.light:not(.has-bg) .cdot.done { background: rgba(0,0,0,0.45); }
    .cdot.current { background: #fff; transform: scale(1.35); }
    body.light:not(.has-bg) .cdot.current { background: #1a1a1e; }

    /* phase badge */
    .phase-badge {
      font-size: clamp(10px,0.65vw,12px); font-weight: 600;
      letter-spacing: 0.10em; text-transform: uppercase;
      padding: 4px 15px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.20);
      backdrop-filter: blur(4px); transition: all 0.4s;
      background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.80);
    }
    body.light:not(.has-bg) .phase-badge { background: rgba(0,0,0,0.07); color: #555; border-color: rgba(0,0,0,0.15); }
    .phase-badge.work-b  { background: rgba(9,255,0,0.12);  color: #09ff00; border-color: rgba(9,255,0,0.30); }
    .phase-badge.short-b { background: rgba(9,255,0,0.12);  color: #09ff00; border-color: rgba(9,255,0,0.30); }
    .phase-badge.long-b  { background: rgba(9,255,0,0.12);  color: #09ff00; border-color: rgba(9,255,0,0.30); }

    /* ── Clock ── */
    .clock-wrap {
      position: relative;
      width: clamp(200px,22vw,280px); height: clamp(200px,22vw,280px);
    }
    .csvg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .bg-track { fill: none; stroke: rgba(255,255,255,0.11); stroke-width: 5; }
    body.light:not(.has-bg) .bg-track { stroke: rgba(0,0,0,0.09); }
    .prog { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.6s linear, stroke 0.5s; }
    .prog.work-c  { stroke: #09ff00; }
    .prog.short-c { stroke: #09ff00; }
    .prog.long-c  { stroke: #09ff00; }

    .clock-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }

    .tdisp {
      font-family: 'DM Mono', monospace;
      font-size: clamp(40px,4.2vw,64px); font-weight: 300;
      color: rgba(255,255,255,0.93); letter-spacing: -3px; line-height: 1;
      background: none; border: none; outline: none;
      text-align: center; width: 100%;
      caret-color: rgba(255,255,255,0.50); cursor: text;
      border-bottom: 1.5px solid transparent; transition: border-color 0.2s;
    }
    body.light:not(.has-bg) .tdisp { color: #1a1a1e; caret-color: #555; }
    .tdisp:focus { border-bottom-color: rgba(255,255,255,0.35); }
    body.light:not(.has-bg) .tdisp:focus { border-bottom-color: rgba(0,0,0,0.20); }

    .edit-hint { font-size: clamp(9px,0.6vw,11px); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.26); font-family: 'Syne',sans-serif; font-weight: 600; transition: opacity 0.2s; }
    body.light:not(.has-bg) .edit-hint { color: rgba(0,0,0,0.22); }
    .status-lbl { font-size: clamp(10px,0.65vw,12px); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.32); }
    body.light:not(.has-bg) .status-lbl { color: rgba(0,0,0,0.26); }

    /* ── Sound panel ── */
    .panel {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: clamp(10px,1.1vh,15px) clamp(14px,1.4vw,20px);
      width: 100%; backdrop-filter: blur(16px);
      display: flex; flex-direction: column; align-items: center; gap: clamp(8px,0.9vh,11px);
    }
    body.light:not(.has-bg) .panel { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.09); }

    .plbl { font-size: clamp(9px,0.6vw,11px); font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(255,255,255,0.34); display: flex; align-items: center; gap: 4px; }
    .plbl svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    body.light:not(.has-bg) .plbl { color: rgba(0,0,0,0.28); }

    .sound-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .sb {
      font-family: 'Syne',sans-serif; font-size: clamp(10px,0.65vw,12px); font-weight: 600;
      padding: 4px 12px; border-radius: 7px; cursor: pointer;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.68);
      border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(4px);
      transition: all 0.15s; display: flex; align-items: center; gap: 4px;
    }
    .sb svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    body.light:not(.has-bg) .sb { background: rgba(0,0,0,0.06); color: #666; border-color: rgba(0,0,0,0.14); }
    .sb:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .sb.active { background: rgba(255,255,255,0.86); color: #1a1a1e; border-color: transparent; }
    body.light:not(.has-bg) .sb.active { background: #2a2a2e; color: #edecea; }

    .vol-row { display: flex; align-items: center; gap: 9px; width: 100%; }
    .vi { flex-shrink: 0; color: rgba(255,255,255,0.36); display: flex; align-items: center; }
    .vi svg { width: clamp(13px,0.9vw,16px); height: clamp(13px,0.9vw,16px); stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    body.light:not(.has-bg) .vi { color: rgba(0,0,0,0.26); }
    .vv { font-family: 'DM Mono',monospace; font-size: clamp(10px,0.65vw,12px); color: rgba(255,255,255,0.48); min-width: 32px; text-align: right; }
    body.light:not(.has-bg) .vv { color: rgba(0,0,0,0.32); }

    input[type=range] { flex: 1; -webkit-appearance: none; height: 3px; border-radius: 99px; background: rgba(255,255,255,0.20); outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.86); }
    body.light:not(.has-bg) input[type=range] { background: rgba(0,0,0,0.15); }
    body.light:not(.has-bg) input[type=range]::-webkit-slider-thumb { background: #2a2a2e; }

    .prev-btn { font-family: 'Syne',sans-serif; font-size: clamp(9px,0.6vw,11px); padding: 3px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.34); cursor: pointer; transition: all 0.15s; }
    body.light:not(.has-bg) .prev-btn { border-color: rgba(0,0,0,0.12); color: rgba(0,0,0,0.26); }
    .prev-btn:hover { color: #fff; border-color: rgba(255,255,255,0.44); }

    /* ── Controls ── */
    .controls { display: flex; gap: 10px; align-items: center; }

    .cbtn {
      font-family: 'Syne',sans-serif;
      font-size: clamp(11px,0.75vw,14px); font-weight: 600; letter-spacing: 0.04em;
      display: flex; align-items: center; gap: 6px;
      padding: clamp(8px,0.9vh,12px) clamp(18px,1.6vw,26px);
      border-radius: 13px;
      background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.84);
      border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(6px);
      cursor: pointer; transition: all 0.15s;
    }
    .cbtn svg { width: clamp(13px,0.9vw,16px); height: clamp(13px,0.9vw,16px); stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    body.light:not(.has-bg) .cbtn { background: rgba(0,0,0,0.06); color: #333; border-color: rgba(0,0,0,0.15); }
    .cbtn:hover { background: rgba(255,255,255,0.17); }
    .cbtn:active { transform: scale(0.97); }
    .cbtn.primary { background: rgba(255,255,255,0.88); color: #1a1a1e; border-color: transparent; }
    body.light:not(.has-bg) .cbtn.primary { background: #2a2a2e; color: #edecea; }
    .cbtn.primary:hover { background: #fff; }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
    .dot.pulse { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .done-msg { font-size: clamp(11px,0.75vw,13px); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0; transition: opacity 0.3s; height: 16px; color: rgba(255,255,255,0.60); }
    body.light:not(.has-bg) .done-msg { color: rgba(0,0,0,0.36); }
    .done-msg.vis { opacity: 1; }
  </style>
</head>
<body>

<div id="bg-layer"></div>
<div id="bg-overlay"></div>

<div class="card">

  <div class="topbar">
    <div class="cycle-dots" id="cdots"></div>
    <div class="topbar-right">
      <label class="ib" title="Subir imagen de fondo" style="cursor:pointer">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 4 3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M16 5v6m-3-3h6"/></svg>
        <input type="file" id="bgu" accept="image/*" style="display:none">
      </label>
      <button class="ib" id="rmbg" title="Quitar imagen" style="display:none">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 2-2"/><path d="M17 17l2 2m0-2l-2 2"/></svg>
      </button>
      <button class="ib" id="dkbtn" title="Modo claro/oscuro">
        <svg id="dksvg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>

  <span class="phase-badge work-b" id="badge">Trabajo</span>

  <div class="clock-wrap">
    <svg class="csvg" viewBox="0 0 215 215">
      <circle class="bg-track" cx="107.5" cy="107.5" r="94"/>
      <circle class="prog work-c" id="ring" cx="107.5" cy="107.5" r="94"/>
    </svg>
    <div class="clock-inner">
      <input class="tdisp" id="tdisp" type="text" value="25:00" maxlength="5" aria-label="Tiempo editable MM:SS">
      <span class="edit-hint" id="ehint">toca para editar</span>
      <span class="status-lbl" id="slbl">listo</span>
    </div>
  </div>

  <div class="panel">
    <span class="plbl">
      <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      sonido de alarma
    </span>
    <div class="sound-row">
      <button class="sb active" data-sound="digital"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Digital</button>
      <button class="sb" data-sound="chime"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Carillón</button>
      <button class="sb" data-sound="pulse"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Pulso</button>
      <button class="sb" data-sound="none"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>Silencio</button>
    </div>
    <div class="vol-row">
      <span class="vi"><svg id="vsvg" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>
      <input type="range" min="0" max="100" value="50" step="1" id="vslider" aria-label="Volumen">
      <span class="vv" id="vval">50%</span>
    </div>
    <button class="prev-btn" id="prevbtn">Probar sonido</button>
  </div>

  <div class="done-msg" id="donemsg">¡Tiempo!</div>

  <div class="controls">
    <button class="cbtn" id="skipbtn">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>Saltar
    </button>
    <button class="cbtn primary" id="playbtn"><span class="dot"></span>Iniciar</button>
  </div>

</div>

<script>
  const bgl     = document.getElementById('bg-layer');
  const dkbtn   = document.getElementById('dkbtn');
  const dksvg   = document.getElementById('dksvg');
  const bgu     = document.getElementById('bgu');
  const rmbg    = document.getElementById('rmbg');
  const ring    = document.getElementById('ring');
  const tdisp   = document.getElementById('tdisp');
  const slbl    = document.getElementById('slbl');
  const ehint   = document.getElementById('ehint');
  const playbtn = document.getElementById('playbtn');
  const skipbtn = document.getElementById('skipbtn');
  const donemsg = document.getElementById('donemsg');
  const prevbtn = document.getElementById('prevbtn');
  const vslider = document.getElementById('vslider');
  const vval    = document.getElementById('vval');
  const vsvg    = document.getElementById('vsvg');
  const badge   = document.getElementById('badge');
  const cdots   = document.getElementById('cdots');

  const R = 94, CIRC = 2 * Math.PI * R;
  ring.style.strokeDasharray = CIRC;

  // Pomodoro cycle: work → short break → work → long break
  const CYCLE = [
    { label: 'Trabajo',         mins: 25, badgeClass: 'work-b',  ringClass: 'work-c',  bgClass: ''      },
    { label: 'Descanso corto',  mins: 5,  badgeClass: 'short-b', ringClass: 'short-c', bgClass: 'short' },
    { label: 'Trabajo',         mins: 25, badgeClass: 'work-b',  ringClass: 'work-c',  bgClass: ''      },
    { label: 'Descanso largo',  mins: 30, badgeClass: 'long-b',  ringClass: 'long-c',  bgClass: 'long'  },
  ];

  let step = 0, totalSecs = 25*60, remaining = 25*60;
  let running = false, iv = null;
  let selSound = 'digital', vol = 0.5, hasBg = false, isDark = true;
  let actx = null;

  const sunPath  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const volPaths = {
    off:  '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
    low:  '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
    high: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'
  };

  function getCtx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
  function mkGain(ctx) { const g = ctx.createGain(); g.gain.value = vol; g.connect(ctx.destination); return g; }
  const sounds = {
    digital: ctx => { const t=ctx.currentTime,m=mkGain(ctx); [0,.22,.44,.66,.88].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(m);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(0.6,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.18);o.start(t+d);o.stop(t+d+.2);}); },
    chime:   ctx => { const t=ctx.currentTime,m=mkGain(ctx); [523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(m);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.22);g.gain.linearRampToValueAtTime(.5,t+i*.22+.05);g.gain.exponentialRampToValueAtTime(.001,t+i*.22+1.4);o.start(t+i*.22);o.stop(t+i*.22+1.5);}); },
    pulse:   ctx => { const t=ctx.currentTime,m=mkGain(ctx); for(let i=0;i<6;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(m);o.type='sine';o.frequency.value=i%2===0?660:880;g.gain.setValueAtTime(.5,t+i*.15);g.gain.exponentialRampToValueAtTime(.001,t+i*.15+.12);o.start(t+i*.15);o.stop(t+i*.15+.13);} },
    none: () => {}
  };
  function playSound(n) { if(n==='none') return; try { const c=getCtx(); c.state==='suspended'?c.resume().then(()=>sounds[n](c)):sounds[n](c); } catch(e){} }

  function buildDots() {
    cdots.innerHTML = '';
    CYCLE.forEach((_,i) => {
      const d = document.createElement('span');
      d.className = 'cdot' + (i < step ? ' done' : i === step ? ' current' : '');
      cdots.appendChild(d);
    });
  }

  function applyTheme() {
    const ph = CYCLE[step];
    // build body class list
    let cls = '';
    if (!isDark && !hasBg) cls += 'light ';
    if (ph.bgClass) cls += ph.bgClass + ' ';
    if (hasBg) cls += 'has-bg';
    document.body.className = cls.trim();
    bgl.classList.toggle('on', hasBg);
    dksvg.innerHTML = isDark ? moonPath : sunPath;
  }

  function loadPhase() {
    const ph = CYCLE[step];
    totalSecs = ph.mins * 60;
    remaining = totalSecs;
    badge.className = 'phase-badge ' + ph.badgeClass;
    badge.textContent = ph.label;
    ring.className = 'prog ' + ph.ringClass;
    buildDots();
    applyTheme();
    updateDisplay();
    setPlayState(false);
    playbtn.disabled = false;
    donemsg.classList.remove('vis');
  }

  bgu.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { bgl.style.backgroundImage='url('+ev.target.result+')'; hasBg=true; rmbg.style.display='flex'; applyTheme(); };
    r.readAsDataURL(f);
  });
  rmbg.addEventListener('click', () => { bgl.style.backgroundImage=''; hasBg=false; rmbg.style.display='none'; applyTheme(); });
  dkbtn.addEventListener('click', () => { isDark=!isDark; applyTheme(); });

  vslider.addEventListener('input', () => {
    vol = parseInt(vslider.value)/100;
    vval.textContent = vslider.value + '%';
    vsvg.innerHTML = vol===0 ? volPaths.off : vol<0.5 ? volPaths.low : volPaths.high;
  });

  function fmt(s) { return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function parseFmt(str) {
    const clean = str.replace(/[^0-9:]/g,'');
    const parts = clean.split(':');
    if (parts.length===2){const m=parseInt(parts[0])||0,s=parseInt(parts[1])||0;return Math.min(m,99)*60+Math.min(s,59);}
    const n=parseInt(clean)||0; return n<100?n*60:Math.floor(n/100)*60+(n%100);
  }
  function setProgress(r) {
    const frac = r/totalSecs;
    ring.style.strokeDashoffset = CIRC*(1-frac);
  }
  function updateDisplay() { tdisp.value = fmt(remaining); setProgress(remaining); }

  function setPlayState(state) {
    running = state;
    if (state) {
      playbtn.innerHTML = '<span class="dot pulse"></span>Pausar';
      slbl.textContent = 'corriendo'; donemsg.classList.remove('vis');
      tdisp.readOnly = true; ehint.style.opacity = '0';
    } else {
      playbtn.innerHTML = '<span class="dot"></span>' + (remaining<totalSecs&&remaining>0 ? 'Reanudar' : 'Iniciar');
      slbl.textContent = remaining===totalSecs ? 'listo' : 'pausado';
      tdisp.readOnly = false; ehint.style.opacity = '1';
    }
  }

  tdisp.addEventListener('focus', () => { if(running) return; ehint.textContent = 'MM:SS · Enter para confirmar'; });
  tdisp.addEventListener('blur',  () => {
    const s = parseFmt(tdisp.value);
    if (s>0) { totalSecs=s; remaining=s; }
    updateDisplay(); slbl.textContent='listo'; ehint.textContent='toca para editar';
  });
  tdisp.addEventListener('keydown', e => {
    if (e.key==='Enter') tdisp.blur();
    if (e.key==='Escape') { tdisp.value=fmt(remaining); tdisp.blur(); }
  });

  function advanceStep() {
    step = (step+1) % CYCLE.length;
    loadPhase();
  }

  function startTimer() {
    if (remaining===0) return;
    setPlayState(true);
    iv = setInterval(() => {
      remaining--;
      updateDisplay();
      if (remaining===0) {
        clearInterval(iv); running=false;
        donemsg.classList.add('vis');
        slbl.textContent = 'terminado';
        playbtn.innerHTML = '<span class="dot"></span>Iniciar';
        playSound(selSound);
        setTimeout(() => { advanceStep(); }, 3000);
      }
    }, 1000);
  }

  function pauseTimer() { clearInterval(iv); setPlayState(false); }

  skipbtn.addEventListener('click', () => { clearInterval(iv); donemsg.classList.remove('vis'); advanceStep(); });
  playbtn.addEventListener('click', () => { if(running) pauseTimer(); else startTimer(); });

  document.querySelectorAll('.sb').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sb').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); selSound = btn.dataset.sound;
    });
  });
  prevbtn.addEventListener('click', () => {
    prevbtn.textContent='Reproduciendo...'; playSound(selSound);
    setTimeout(() => { prevbtn.textContent='Probar sonido'; }, 2000);
  });

  loadPhase();
</script>
</body>
</html>
